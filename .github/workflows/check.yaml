name: check
on:
  push:
    branches:
      - main
      - develop
jobs:
  check:
    runs-on: test

    steps: |
        sleep 5
        if docker ps -q --filter "publish=8787" | grep -q .; then
          CON_ID=$(docker ps -q --filter "publish=8787")
          echo "Container : $CON_ID is running"
        else
          echo "Check deployment : NO CONTAINER DEPLOYED"
          exit 1
        fi