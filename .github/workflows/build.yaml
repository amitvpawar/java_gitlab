name: Buil jobs
on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: test

    steps:
      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      
      - name: Build Docker image
        run: |
          docker --version
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t java-app-test:$SHORT_SHA .