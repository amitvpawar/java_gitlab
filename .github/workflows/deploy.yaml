name: Deploy to UAT

on:
  push:
    branches:
      - main
      - develop
jobs:
  deploy:
    runs-on: test

    steps:
      - name: Stop Existing Container
        run: |
          if docker ps -q --filter "publish=8787" | grep -q .; then
            echo "Stopping container running on port 8787"
            docker ps -q --filter "publish=8787" | xargs -r docker rm -f
          else
            echo "No container running on port 8787"
          fi

      - name:
        run: |
          docker run -d -p 8787:8787 --name test-jva-$SHORT_SHA java-app-test:$SHORT_SHA
